name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Tests only need to read the repo — never hand fork PRs a write-scoped token.
permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # "3.9" pins the below-floor world (stock-mac python3): installer
        # tests must skip with a reason there, never fail (2026-07-17)
        python-version: ["3.9", "3.10", "3.x"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
